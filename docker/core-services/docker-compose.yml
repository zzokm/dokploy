# Core services data plane (local dev / optional staging).
# Run from repo root: pnpm core-services:up  (DNS only) or pnpm core-services:up:mail
#
# Volume alignment with serverPaths() (dev): the panel runs with cwd apps/dokploy and writes
# under apps/dokploy/.docker/core-services/{dns,mail}/... — these host paths are mounted below
# so zone files and mail flat files appear inside containers immediately after Apply / Provision.
#
# Network default matches packages/server/src/constants/server-paths.ts mailNetworkName (dokploy-network).

services:
  core-services-bind:
    image: internetsystemsconsortium/bind9:9.18
    container_name: core-services-bind
    restart: unless-stopped
    ports:
      - "${PANEL_INFRA_BIND_DNS_PORT:-5353}:53/udp"
      - "${PANEL_INFRA_BIND_DNS_PORT:-5353}:53/tcp"
    volumes:
      - ../../apps/dokploy/.docker/core-services/dns/config:/etc/bind:rw
      - ../../apps/dokploy/.docker/core-services/dns/cache:/var/cache/bind:rw
    networks:
      - core-services

  # Data-plane mail (reference images). Tune host configs / image docs for production.
  core-services-dovecot:
    profiles: [mail]
    image: dovecot/dovecot:latest
    container_name: core-services-dovecot
    restart: unless-stopped
    depends_on:
      - core-services-bind
    ports:
      - "${PANEL_INFRA_DOVECOT_IMAP:-3143}:143"
      - "${PANEL_INFRA_DOVECOT_IMAPS:-3993}:993"
    volumes:
      - ../../apps/dokploy/.docker/core-services/mail/auth:/etc/mail-auth:ro
      - ../../apps/dokploy/.docker/core-services/mail/data:/var/mail:rw
      - ../../apps/dokploy/.docker/core-services/mail/tls:/etc/dovecot/tls:ro
    networks:
      - core-services

  core-services-exim:
    profiles: [mail]
    image: exim/exim4:latest
    container_name: core-services-exim
    restart: unless-stopped
    depends_on:
      - core-services-bind
    ports:
      - "${PANEL_INFRA_EXIM_SMTP:-3025}:25"
      - "${PANEL_INFRA_EXIM_SUBMISSION:-3587}:587"
    volumes:
      - ../../apps/dokploy/.docker/core-services/mail/auth:/etc/mail-auth:ro
      - ../../apps/dokploy/.docker/core-services/mail/data:/var/mail:rw
      - ../../apps/dokploy/.docker/core-services/mail/tls:/etc/exim4/tls:ro
    networks:
      - core-services

  core-services-roundcube:
    profiles: [mail]
    image: roundcube/roundcubemail:latest
    container_name: core-services-roundcube
    restart: unless-stopped
    depends_on:
      - core-services-dovecot
      - core-services-exim
    ports:
      - "${PANEL_INFRA_ROUNDCUBE_HTTP:-3080}:80"
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: core-services-dovecot
      ROUNDCUBEMAIL_DEFAULT_PORT: "143"
      ROUNDCUBEMAIL_SMTP_SERVER: core-services-exim
      ROUNDCUBEMAIL_SMTP_PORT: "587"
      ROUNDCUBEMAIL_DB_TYPE: sqlite
    volumes:
      - ../../apps/dokploy/.docker/core-services/mail/roundcube:/var/roundcube/db
    networks:
      - core-services

networks:
  core-services:
    name: ${PANEL_CORE_SERVICES_NETWORK:-dokploy-network}
    driver: bridge
