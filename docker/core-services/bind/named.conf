// Panel infra — BIND 9 authoritative template (no upstream GPL sources in-repo).
// Zone files and named.conf.local are written by the Dokploy control plane.

options {
	directory "/var/cache/bind";
	listen-on port 53 { any; };
	listen-on-v6 port 53 { any; };
	allow-query { any; };
	recursion no;
	dnssec-validation no;
};

include "/etc/bind/named.conf.local";
