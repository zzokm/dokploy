# Core services data plane (local dev / optional staging).
# Run from repo root: pnpm core-services:up  (DNS only) or pnpm core-services:up:mail
#
# Volume alignment with serverPaths() (dev): the panel runs with cwd apps/dokploy and writes
# under apps/dokploy/.docker/core-services/{dns,mail}/... — these host paths are mounted below
# so zone files and mail data appear inside containers immediately after Apply / Provision.
#
# Network: same name as server-paths mailNetworkName (default dokploy-network). Declared external
# because `pnpm dokploy:setup` (or Swarm/bootstrap) may already create that bridge; Compose must not
# try to own it or you get label conflicts.

services:
  core-services-bind:
    image: internetsystemsconsortium/bind9:9.18
    container_name: core-services-bind
    restart: unless-stopped
    ports:
      # Default 1053: port 53 is privileged; 5353 is mDNS and often in use on Windows/macOS.
      - "${PANEL_INFRA_BIND_DNS_PORT:-1053}:53/udp"
      - "${PANEL_INFRA_BIND_DNS_PORT:-1053}:53/tcp"
    volumes:
      - ../../apps/dokploy/.docker/core-services/dns/config:/etc/bind:rw
      - ../../apps/dokploy/.docker/core-services/dns/cache:/var/cache/bind:rw
    networks:
      - core-services

  dokploy-mailserver:
    profiles: [mail]
    image: mailserver/docker-mailserver:latest
    container_name: ${PANEL_MAILSERVER_CONTAINER:-dokploy-mailserver}
    hostname: ${PANEL_DMS_OVERRIDE_HOSTNAME:-mail.local}
    restart: unless-stopped
    depends_on:
      - core-services-bind
    ports:
      - "${PANEL_INFRA_DMS_SMTP:-3025}:25"
      - "${PANEL_INFRA_DMS_SUBMISSION:-3587}:587"
      - "${PANEL_INFRA_DMS_SMTPS:-3465}:465"
      - "${PANEL_INFRA_DMS_IMAP:-3143}:143"
      - "${PANEL_INFRA_DMS_IMAPS:-3993}:993"
    environment:
      ENABLE_SPAMASSASSIN: "1"
      ENABLE_CLAMAV: "0"
      ENABLE_FAIL2BAN: "1"
      ENABLE_POSTGREY: "0"
      ONE_DIR: "1"
      DMS_DEBUG: "0"
      SSL_TYPE: manual
      SSL_CERT_PATH: /tmp/docker-mailserver/ssl/cert.pem
      SSL_KEY_PATH: /tmp/docker-mailserver/ssl/key.pem
      OVERRIDE_HOSTNAME: ${PANEL_DMS_OVERRIDE_HOSTNAME:-mail.local}
      POSTMASTER_ADDRESS: ${PANEL_DMS_POSTMASTER_ADDRESS:-postmaster@mail.local}
    volumes:
      - ../../apps/dokploy/.docker/core-services/mail/data:/var/mail:rw
      - ../../apps/dokploy/.docker/core-services/mail/state:/var/mail-state:rw
      - ../../apps/dokploy/.docker/core-services/mail/logs:/var/log/mail:rw
      - ../../apps/dokploy/.docker/core-services/mail/dms-config:/tmp/docker-mailserver:rw
    networks:
      - core-services

  core-services-roundcube:
    profiles: [mail]
    image: roundcube/roundcubemail:latest
    container_name: core-services-roundcube
    restart: unless-stopped
    depends_on:
      - dokploy-mailserver
    ports:
      - "${PANEL_INFRA_ROUNDCUBE_HTTP:-3080}:80"
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: "ssl://${PANEL_MAILSERVER_CONTAINER:-dokploy-mailserver}"
      ROUNDCUBEMAIL_DEFAULT_PORT: "993"
      ROUNDCUBEMAIL_SMTP_SERVER: "tls://${PANEL_MAILSERVER_CONTAINER:-dokploy-mailserver}"
      ROUNDCUBEMAIL_SMTP_PORT: "587"
      ROUNDCUBEMAIL_DB_TYPE: sqlite
    volumes:
      - ../../apps/dokploy/.docker/core-services/mail/roundcube:/var/roundcube/db
      - ../../apps/dokploy/.docker/core-services/mail/roundcube-config:/var/roundcube/config
    networks:
      - core-services

networks:
  core-services:
    name: ${PANEL_CORE_SERVICES_NETWORK:-dokploy-network}
    external: true
